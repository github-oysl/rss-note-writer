<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>手机号登录</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="p-4">
  <h2>手机号登录</h2>
  {% if error %}
  <div class="alert alert-danger">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="row g-3" style="max-width:480px;">
    <div class="col-12">
      <label class="form-label">手机号</label>
      <input class="form-control" name="phone" placeholder="请输入手机号" required />
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit">登录</button>
    </div>
  </form>
</body>
</html>
