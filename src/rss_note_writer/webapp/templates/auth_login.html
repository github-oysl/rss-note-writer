<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>登录获取 Token - RSS Note Writer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 0; }
    header { padding: 12px 16px; border-bottom: 1px solid #eee; }
    main { display: flex; gap: 16px; padding: 16px; }
    .panel { flex: 1; border: 1px solid #eee; border-radius: 8px; padding: 12px; }
    .panel h2 { margin: 8px 0 12px; font-size: 16px; }
    iframe { width: 100%; height: 540px; border: 1px solid #ddd; border-radius: 8px; }
    .hint { color: #777; font-size: 13px; }
    .token-input { width: 100%; padding: 8px; font-size: 14px; }
    .actions { margin-top: 8px; }
    button { padding: 8px 12px; font-size: 14px; }
    a.btn { display: inline-block; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <strong>登录获取 Token</strong>
    <span class="hint">完成登录后，将 Bearer Token 粘贴到右侧并保存</span>
  </header>

  <main>
    <section class="panel">
      <h2>登录页面（尝试嵌入）</h2>
      <div class="hint">如嵌入被拦截或加载缓慢，请点击下方按钮在新窗口打开</div>
      <div id="login-frame-wrap">
        <iframe id="login-frame" src="https://biji.com" loading="lazy" referrerpolicy="no-referrer"></iframe>
        <div id="login-frame-status" class="hint" style="margin-top:6px;">提示：外部登录页可能不允许被嵌入或加载较慢，页面其它功能可正常使用</div>
      </div>
      <div class="actions" style="margin-top:8px;">
        <a class="btn" href="https://biji.com" target="_blank" rel="noopener">在新窗口打开登录页</a>
      </div>
    </section>

    <section class="panel">
      <h2>保存 Bearer Token</h2>
      <form method="post" action="/auth/save_token">
        <label for="token">Bearer Token：</label>
        <input id="token" name="token" class="token-input" type="text" placeholder="例如：eyJhbGciOi..." required />
        <div class="hint" style="margin-top:6px;">
          提示：
          <ul>
            <li>Token 一般可在开发者工具的网络请求头中看到（Authorization: Bearer xxx）。</li>
            <li>若以“Bearer ”开头，系统会自动去除前缀。</li>
            <li>保存后可在“鉴权测试”页面验证有效性。</li>
          </ul>
        </div>
        <div class="actions">
          <button type="submit">保存到 .env 并验证</button>
          <a class="btn" href="/auth/check">前往鉴权测试</a>
        </div>
      </form>
    </section>
  </main>
  <script>
    (function() {
      var frame = document.getElementById('login-frame');
      var status = document.getElementById('login-frame-status');
      if (!frame || !status) return;
      var loaded = false;
      frame.addEventListener('load', function(){ loaded = true; status.textContent = '登录页已加载（若显示空白，说明站点禁止被嵌入）'; });
      frame.addEventListener('error', function(){ status.textContent = '无法嵌入登录页：站点可能禁止被嵌入。请点击上方按钮在新窗口打开。'; });
      setTimeout(function(){ if (!loaded) { status.textContent = '登录页加载中或被阻止，建议点击“在新窗口打开登录页”。'; } }, 2000);
    })();
  </script>
</body>
</html>
