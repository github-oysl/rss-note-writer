<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>编辑配置</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="p-4">
  <h2>编辑配置 #{{ config_id }}</h2>
  <div class="mb-3">
    <a class="btn btn-link" href="/configs">返回配置列表</a>
  </div>
  <form method="post" action="/configs/update" class="row g-3">
    <input type="hidden" name="config_id" value="{{ config_id }}" />
    <div class="col-md-6">
      <label class="form-label">RSS URL</label>
      <input class="form-control" name="rss_url" value="{{ item.rss_url if item else '' }}" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Topic ID</label>
      <input class="form-control" name="topic_id" value="{{ item.topic_id if item else '' }}" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Directory ID</label>
      <input class="form-control" name="topic_directory_id" value="{{ item.topic_directory_id if item else '' }}" />
    </div>
    <div class="col-md-2">
      <label class="form-label">Max Links</label>
      <input class="form-control" type="number" name="max_links" value="{{ item.max_links if item else 10 }}" />
    </div>
    <div class="col-md-8">
      <label class="form-label">Content</label>
      <input class="form-control" name="content" value="{{ item.content if item else '' }}" />
    </div>
    <div class="col-md-4">
      <label class="form-label">Cron</label>
      <input class="form-control" name="cron" value="{{ item.cron if item else '' }}" />
    </div>
    <div class="col-md-2">
      <label class="form-label">Active</label>
      <select class="form-select" name="active">
        <option value="true" {% if item and item.active %}selected{% endif %}>True</option>
        <option value="false" {% if item and not item.active %}selected{% endif %}>False</option>
      </select>
    </div>
    <div class="col-12">
      <button class="btn btn-primary" type="submit">保存修改</button>
    </div>
  </form>
</body>
</html>
