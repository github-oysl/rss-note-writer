<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>写入数据查看</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="p-4">
  <h2>写入数据查看</h2>
  {% if request.query_params.get('deleted') %}
  <div class="alert alert-success">已删除 {{ request.query_params.get('deleted') }} 条记录</div>
  {% endif %}
  <div class="mb-3">
    <a class="btn btn-link" href="/configs">返回配置管理</a>
  </div>

  <form class="row g-3" method="get" action="/links">
    <div class="col-md-3">
      <label class="form-label">Topic ID</label>
      <input class="form-control" name="topic_id" value="{{ topic_id or '' }}" />
    </div>
    <div class="col-md-3">
      <label class="form-label">状态码</label>
      <input class="form-control" type="number" name="status_code" value="{{ status_code or '' }}" />
    </div>
    <div class="col-md-4">
      <label class="form-label">RSS URL</label>
      <input class="form-control" name="rss_url" value="{{ rss_url or '' }}" />
    </div>
    <div class="col-md-2">
      <label class="form-label">Limit</label>
      <input class="form-control" type="number" name="limit" value="{{ limit or 100 }}" />
    </div>
    <div class="col-md-2">
      <label class="form-label">Offset</label>
      <input class="form-control" type="number" name="offset" value="{{ offset or 0 }}" />
    </div>
    <div class="col-md-2 align-self-end">
      <button class="btn btn-primary" type="submit">筛选</button>
    </div>
  </form>

  <hr/>
  <form method="post" action="/links/bulk_delete">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <div>
      <button class="btn btn-danger" type="submit" onclick="return confirm('确定批量删除选中记录?')">批量删除</button>
    </div>
  </div>
  <table class="table table-striped">
    <thead>
      <tr>
        <th><input type="checkbox" onclick="document.querySelectorAll('input[name=ids]').forEach(cb=>cb.checked=this.checked)"></th>
        <th>ID</th>
        <th>Topic</th>
        <th>Link</th>
        <th>状态码</th>
        <th>处理时间</th>
        <th>详情</th>
      </tr>
    </thead>
    <tbody>
      {% for it in items %}
      <tr>
        <td><input type="checkbox" name="ids" value="{{ it.id }}" /></td>
        <td>{{ it.id }}</td>
        <td>{{ it.topic_id }}</td>
        <td><a href="{{ it.link_url }}" target="_blank">{{ it.link_url }}</a></td>
        <td>{{ it.status_code }}</td>
        <td>{{ it.processed_at }}</td>
        <td><a class="btn btn-sm btn-outline-primary" href="/links/{{ it.id }}">查看</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  </form>
</body>
</html>
